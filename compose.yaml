services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Connection: Server=db;Port=3306;Database=${MYSQL_DATABASE};Uid=${MYSQL_USER};Pwd=${MYSQL_PASSWORD}
      Database__RunMigrationsOnStartup: ${DATABASE_RUN_MIGRATIONS_ON_STARTUP}
      Settings__Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Settings__Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES}
      Storage__Provider: ${STORAGE_PROVIDER}
      Storage__BucketName: ${MINIO_BUCKET_EXPENSE_ATTACHMENTS}
      Storage__Endpoint: http://minio:9000
      Storage__PublicEndpoint: http://localhost:${MINIO_API_PORT}
      Storage__AccessKey: ${MINIO_ACCESS_KEY}
      Storage__SecretKey: ${MINIO_SECRET_KEY}
      Redis__Configuration: redis:6379
    ports:
      - "${API_PORT}:8080"

  db:
    image: mysql:8.0
    container_name: cashflow-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - cashflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: cashflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - cashflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: cashflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - cashflow_minio_data:/data

volumes:
  cashflow_mysql_data:
  cashflow_redis_data:
  cashflow_minio_data:
