# Pipeline legada de release para Azure Container Registry.
# Mantida no repositório como referência histórica.
# Desativada temporariamente porque a conta/infra de Azure não está operacional.
trigger: none
pr: none

variables:
  dockerRegistryServiceConnection: 'a3d4b33a-62ef-4d37-b27a-1ab1849fb7dd'
  imageRepository: 'apicashflow'
  containerRegistry: 'apicashflowprod.azurecr.io'
  dockerfilePath: 'Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# Quando a trilha de deploy em cloud for retomada, revisar:
# - secure file `appsettings.Production.json`
# - service connection do ACR
# - estratégia atual de build/push versus compose/infra do projeto
steps:
- task: DownloadSecureFile@1
  name: appsettings
  displayName: Download AppSettings.json
  inputs:
    secureFile: appsettings.Production.json
- script: |
    cp $(appsettings.secureFilePath) src/CashFlow.Api/appsettings.Production.json     
- task: Docker@2
  displayName: Build and push an image to container registry
  inputs:
    command: buildAndPush
    repository: $(imageRepository)
    dockerfile: $(dockerfilePath)
    containerRegistry: $(dockerRegistryServiceConnection)
    tags: |
      latest
      $(tag)
