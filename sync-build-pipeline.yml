name: Build & Run Tests CashFlow API

# Pipeline legada de sincronização com Azure Repos.
# Mantida como histórico, mas desativada temporariamente porque a integração Azure
# não é mais uma dependência operacional do projeto neste momento.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
- group: SyncToAzure

# Quando essa integração voltar a fazer sentido, revisar:
# - variável `AZURE_REPO_PAT`
# - repositório remoto do Azure DevOps
# - necessidade real de espelhar código do GitHub para Azure Repos
steps:
- checkout: self
  fetchDepth: 0

- task: DotNetCoreCLI@2
  displayName: Build Solution
  inputs:
    command: build

- task: DotNetCoreCLI@2
  displayName: Run Unit & Integration Tests
  inputs:
    command: test

- script: |
    git config --global user.name "Lucas Silva"
    git config --global user.email "lucasstrlisilva@outlook.com"

    cd $(Build.SourcesDirectory)

    export PAT_TOKEN=$(AZURE_REPO_PAT)

    git remote add azure https://lucasstrlisilva:${PAT_TOKEN}@dev.azure.com/lucasstrlisilva/_git/Cashflow

    git fetch --all

    git checkout -b develop

    git push azure develop --force
  displayName: 'Sync GitHub code to Azure Repos'
  env:
    AZURE_REPO_PAT: $(AZURE_REPO_PAT)
